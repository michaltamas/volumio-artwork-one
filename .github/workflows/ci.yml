name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check shell scripts
        run: shellcheck scripts/*.sh plugin/artwork_one/*.sh

      - name: Install dependencies
        run: npm ci

      - name: Build (type check + Vite)
        run: npm run build

      - name: Plugin tests
        run: NODE_PATH=node_modules node --test test/plugin.test.cjs

      - name: Package the release archive
        run: scripts/package.sh "$(git describe --tags --always)"

      - uses: actions/upload-artifact@v4
        with:
          name: artwork-one
          path: artwork-one.tar.gz
          if-no-files-found: error

      # the plugin folder as the Volumio plugin store wants it (copied into a fork of volumio-plugins-sources-bookworm)
      - uses: actions/upload-artifact@v4
        with:
          name: artwork_one-plugin
          path: build/artwork_one
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: artwork-one

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the matching CHANGELOG section, without the link references
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          printf '\n**Install or update on the player:**\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/main/scripts/install.sh | bash\n```\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" artwork-one.tar.gz \
            --title "Artwork One $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
